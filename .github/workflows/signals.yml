name: Nifty500 Signals

on:
  schedule:
    # 11:37 UTC = 5:07pm IST, Monday-Friday. Deliberately an odd minute
    # rather than the round 11:30 this used to be - GitHub Actions runs
    # scheduled (cron) triggers on a best-effort basis, and a popular
    # on-the-hour/half-hour minute (like :30) gets queued behind every
    # other repo's cron jobs targeting the same instant, which showed up
    # live as 3-5 hour delivery delays (5pm IST scheduled, signals arriving
    # 8-10pm IST). An off-peak minute doesn't guarantee on-time delivery -
    # GitHub gives no SLA on scheduled triggers - but empirically clears
    # much of that queue contention. Either way this is always safely
    # after 4pm IST even with zero delay, since delay only ever pushes a
    # run later, never earlier.
    # scripts/run_signals.py decides internally whether to also run the
    # weekly strategies (Fridays) and/or the monthly ATH breakout (last
    # trading day of the month) - one workflow, one Upstox fetch per day.
    - cron: "37 11 * * 1-5"
  workflow_dispatch:
    inputs:
      force_weekly:
        description: "Also run the weekly strategies even if today isn't Friday"
        type: boolean
        default: false
      force_monthly:
        description: "Also run the monthly ATH breakout even if today isn't month-end"
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Belt-and-suspenders alongside the circuit breaker in signals/data.py:
    # a normal run finishes in a few minutes, so cap the job well below
    # GitHub's 6-hour default in case something still hangs.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Install Playwright's Chromium (for automated Upstox login)
        run: playwright install --with-deps chromium

      - name: Log in to Upstox (TOTP)
        env:
          UPSTOX_CLIENT_ID: ${{ secrets.UPSTOX_CLIENT_ID }}
          UPSTOX_CLIENT_SECRET: ${{ secrets.UPSTOX_CLIENT_SECRET }}
          UPSTOX_REDIRECT_URI: ${{ secrets.UPSTOX_REDIRECT_URI }}
          UPSTOX_MOBILE_NUMBER: ${{ secrets.UPSTOX_MOBILE_NUMBER }}
          UPSTOX_TOTP_SECRET: ${{ secrets.UPSTOX_TOTP_SECRET }}
          UPSTOX_PIN: ${{ secrets.UPSTOX_PIN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/login_upstox.py

      - name: Upload login failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: upstox-login-failure
          path: |
            upstox_login_failure.png
            upstox_login_failure.html
          if-no-files-found: ignore

      - name: Run Nifty500 signal screeners
        env:
          # UPSTOX_ACCESS_TOKEN is already in the job environment here,
          # written by the login step above via $GITHUB_ENV.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCREENER_EMAIL: ${{ secrets.SCREENER_EMAIL }}
          SCREENER_PASSWORD: ${{ secrets.SCREENER_PASSWORD }}
          FORCE_WEEKLY: ${{ inputs.force_weekly && 'true' || '' }}
          FORCE_MONTHLY: ${{ inputs.force_monthly && 'true' || '' }}
        run: python scripts/run_signals.py
