name: Nifty500 Signals

on:
  schedule:
    # 11:30 UTC = 5:00pm IST, Monday-Friday. Only Fridays (weekly breakout)
    # and month-end (monthly ATH breakout) actually have a strategy to run,
    # so the "Decide whether..." step below skips the Playwright/Upstox
    # login and fetch entirely on the other days rather than burning a
    # TOTP login for nothing.
    - cron: "30 11 * * 1-5"
  workflow_dispatch:
    inputs:
      force_weekly:
        description: "Also run the weekly strategies even if today isn't Friday"
        type: boolean
        default: false
      force_monthly:
        description: "Also run the monthly ATH breakout even if today isn't month-end"
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Belt-and-suspenders alongside the circuit breaker in signals/data.py:
    # a normal run finishes in a few minutes, so cap the job well below
    # GitHub's 6-hour default in case something still hangs.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Decide whether either strategy can fire today
        id: checkday
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from datetime import date
          from signals.calendar_utils import is_last_trading_day_of_month
          today = date.today()
          should_run = today.weekday() == 4 or is_last_trading_day_of_month(today)
          print(f'should_run={str(should_run).lower()}')
          " >> "$GITHUB_OUTPUT"

      - name: Install Playwright's Chromium (for automated Upstox login)
        if: steps.checkday.outputs.should_run == 'true' || inputs.force_weekly || inputs.force_monthly
        run: playwright install --with-deps chromium

      - name: Log in to Upstox (TOTP)
        if: steps.checkday.outputs.should_run == 'true' || inputs.force_weekly || inputs.force_monthly
        env:
          UPSTOX_CLIENT_ID: ${{ secrets.UPSTOX_CLIENT_ID }}
          UPSTOX_CLIENT_SECRET: ${{ secrets.UPSTOX_CLIENT_SECRET }}
          UPSTOX_REDIRECT_URI: ${{ secrets.UPSTOX_REDIRECT_URI }}
          UPSTOX_MOBILE_NUMBER: ${{ secrets.UPSTOX_MOBILE_NUMBER }}
          UPSTOX_TOTP_SECRET: ${{ secrets.UPSTOX_TOTP_SECRET }}
          UPSTOX_PIN: ${{ secrets.UPSTOX_PIN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/login_upstox.py

      - name: Upload login failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: upstox-login-failure
          path: |
            upstox_login_failure.png
            upstox_login_failure.html
          if-no-files-found: ignore

      - name: Run Nifty500 signal screeners
        if: steps.checkday.outputs.should_run == 'true' || inputs.force_weekly || inputs.force_monthly
        env:
          # UPSTOX_ACCESS_TOKEN is already in the job environment here,
          # written by the login step above via $GITHUB_ENV.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_WEEKLY: ${{ inputs.force_weekly && 'true' || '' }}
          FORCE_MONTHLY: ${{ inputs.force_monthly && 'true' || '' }}
        run: python scripts/run_signals.py
