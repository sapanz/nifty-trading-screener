name: Context sources probe

# Manual: checks which optional context sources (global macro series, NSE event calendar) answer from a GitHub runner. No Upstox login.
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scripts/probe_context_sources.py
