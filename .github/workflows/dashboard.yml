name: Dashboard

# Keeps docs/index.html's data fresh through the trading session (9:15-15:30 IST,
# longer than GitHub's 6h job cap, so there are a morning and an afternoon start).
# GitHub's cron is best-effort - runs have started hours late or not at all - so each
# start is listed several times: the first scheduled run that gets going does the work,
# later ones queue behind it (concurrency below: one running, at most one waiting, never
# cancelled - a second login would invalidate the first job's token) and the gate step
# lets any run outside market hours exit at once. Morning: 08:50 / 09:05 / 09:20 / 09:35 IST;
# afternoon: 14:30 / 15:00 IST. A run started by hand (workflow_dispatch) always runs.
on:
  schedule:
    - cron: "20 3 * * 1-5"
    - cron: "35 3 * * 1-5"
    - cron: "50 3 * * 1-5"
    - cron: "5 4 * * 1-5"
    - cron: "0 9 * * 1-5"
    - cron: "30 9 * * 1-5"
  workflow_dispatch:
    inputs:
      once:
        description: "Publish a single snapshot and exit (smoke test)"
        type: boolean
        default: false
      refresh_seconds:
        description: "Seconds between refreshes"
        type: number
        default: 120

concurrency:
  group: ${{ github.event_name == 'schedule' && 'dashboard-scheduled' || format('dashboard-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: write   # to publish data.json to the dashboard-data branch

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - name: Gate - only run during market hours (scheduled runs)
        id: gate
        run: |
          # IST = UTC+5:30; weekday 1-5 and 08:40 - 15:30 IST. Manual runs always go ahead.
          now=$(TZ=Asia/Kolkata date +%u" "%H%M)
          dow=${now% *}; hm=$((10#${now#* }))
          if [ "${{ github.event_name }}" != "schedule" ] || { [ "$dow" -le 5 ] && [ "$hm" -ge 840 ] && [ "$hm" -le 1530 ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "Outside market hours ($now IST) - nothing to do."
          fi

      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Install Playwright's Chromium (for automated Upstox login)
        if: steps.gate.outputs.run == 'true'
        run: playwright install --with-deps chromium

      - name: Log in to Upstox (TOTP)
        if: steps.gate.outputs.run == 'true'
        env:
          UPSTOX_CLIENT_ID: ${{ secrets.UPSTOX_CLIENT_ID }}
          UPSTOX_CLIENT_SECRET: ${{ secrets.UPSTOX_CLIENT_SECRET }}
          UPSTOX_REDIRECT_URI: ${{ secrets.UPSTOX_REDIRECT_URI }}
          UPSTOX_MOBILE_NUMBER: ${{ secrets.UPSTOX_MOBILE_NUMBER }}
          UPSTOX_TOTP_SECRET: ${{ secrets.UPSTOX_TOTP_SECRET }}
          UPSTOX_PIN: ${{ secrets.UPSTOX_PIN }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/login_upstox.py

      - name: Upload login failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: upstox-login-failure
          path: |
            upstox_login_failure.png
            upstox_login_failure.html
          if-no-files-found: ignore

      - name: Run dashboard refresher
        if: steps.gate.outputs.run == 'true'
        env:
          # UPSTOX_ACCESS_TOKEN is already in the job environment here,
          # written by the login step above via $GITHUB_ENV.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DASHBOARD_ONCE: ${{ inputs.once }}
          DASHBOARD_REFRESH_SECONDS: ${{ inputs.refresh_seconds || 120 }}
        run: python scripts/run_dashboard.py
