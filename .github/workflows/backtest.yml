name: Backtest

on:
  workflow_dispatch:
    inputs:
      months:
        description: "Lookback window in months"
        type: number
        default: 3

jobs:
  run:
    runs-on: ubuntu-latest
    # Re-scans the whole universe once per historical date in the window,
    # so this runs much longer than a normal live run (order of 10-20 min).
    # A 60-month run got noticeably slower once diagnostic indicators
    # (RSI, added to scan()'s hot path) started being recomputed on every
    # historical date - a run that used to finish in ~25-28 min ran past
    # 40 min and was cancelled rather than risk the old 60-minute cap.
    # Padded to 90 for headroom; if it keeps growing, the real fix is
    # precomputing indicators once per symbol instead of once per
    # (date, symbol) pair, not just raising this further.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Install Playwright's Chromium (for automated Upstox login)
        run: playwright install --with-deps chromium

      - name: Log in to Upstox (TOTP)
        env:
          UPSTOX_CLIENT_ID: ${{ secrets.UPSTOX_CLIENT_ID }}
          UPSTOX_CLIENT_SECRET: ${{ secrets.UPSTOX_CLIENT_SECRET }}
          UPSTOX_REDIRECT_URI: ${{ secrets.UPSTOX_REDIRECT_URI }}
          UPSTOX_MOBILE_NUMBER: ${{ secrets.UPSTOX_MOBILE_NUMBER }}
          UPSTOX_TOTP_SECRET: ${{ secrets.UPSTOX_TOTP_SECRET }}
          UPSTOX_PIN: ${{ secrets.UPSTOX_PIN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/login_upstox.py

      - name: Upload login failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: upstox-login-failure
          path: |
            upstox_login_failure.png
            upstox_login_failure.html
          if-no-files-found: ignore

      - name: Run backtest
        env:
          # UPSTOX_ACCESS_TOKEN is already in the job environment here,
          # written by the login step above via $GITHUB_ENV.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BACKTEST_MONTHS: ${{ inputs.months }}
        run: python scripts/run_backtest.py

      - name: Upload backtest trades CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-trades
          path: backtest_trades.csv
          if-no-files-found: ignore
