name: Trendline Backtest

on:
  workflow_dispatch:
    inputs:
      months:
        description: "Months of 5-minute history to backtest"
        type: number
        default: 12
      symbol_limit:
        description: "Only the first N F&O symbols (0 = all) - use e.g. 5 for a quick smoke test of the 5-minute fetch"
        type: number
        default: 0

jobs:
  run:
    runs-on: ubuntu-latest
    # Fetching a year of 5-minute candles is ~13 requests per symbol, then
    # every bar of every session is scanned.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Install Playwright's Chromium (for automated Upstox login)
        run: playwright install --with-deps chromium

      - name: Log in to Upstox (TOTP)
        env:
          UPSTOX_CLIENT_ID: ${{ secrets.UPSTOX_CLIENT_ID }}
          UPSTOX_CLIENT_SECRET: ${{ secrets.UPSTOX_CLIENT_SECRET }}
          UPSTOX_REDIRECT_URI: ${{ secrets.UPSTOX_REDIRECT_URI }}
          UPSTOX_MOBILE_NUMBER: ${{ secrets.UPSTOX_MOBILE_NUMBER }}
          UPSTOX_TOTP_SECRET: ${{ secrets.UPSTOX_TOTP_SECRET }}
          UPSTOX_PIN: ${{ secrets.UPSTOX_PIN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/login_upstox.py

      - name: Upload login failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: upstox-login-failure
          path: |
            upstox_login_failure.png
            upstox_login_failure.html
          if-no-files-found: ignore

      - name: Run trendline backtest
        env:
          # UPSTOX_ACCESS_TOKEN is already in the job environment here,
          # written by the login step above via $GITHUB_ENV.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRENDLINE_BACKTEST_MONTHS: ${{ inputs.months }}
          TRENDLINE_SYMBOL_LIMIT: ${{ inputs.symbol_limit }}
        run: python scripts/run_trendline_backtest.py

      - name: Upload trade CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trendline-backtest
          path: trendline_backtest.csv
          if-no-files-found: ignore
