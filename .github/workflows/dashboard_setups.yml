name: Dashboard price action

# Nightly after the close: weekly support zones and weekly breakouts for the dashboard's Price action view.
on:
  workflow_run:
    workflows: ["Dashboard swing"]       # the last of the chain: history (15:45 IST) -> swing -> price action, one Upstox login at a time
    types: [completed]
  workflow_dispatch:

concurrency:
  group: dashboard-setups
  cancel-in-progress: false

permissions:
  contents: write   # to publish to the dashboard-setups branch

jobs:
  gate:
    # GitHub's cron can start hours late: a scheduled or chained run that lands in market hours (08:40-15:45 IST on weekdays) must not log in to Upstox (a second login cuts off the live dashboard's token).
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.t.outputs.go }}
    steps:
      - id: t
        run: |
          now=$(TZ=Asia/Kolkata date +%H%M); dow=$(TZ=Asia/Kolkata date +%u)
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$dow" -le 5 ] && [ "$now" -ge 0840 ] && [ "$now" -lt 1545 ]; then echo "go=false" >> "$GITHUB_OUTPUT"; echo "Market hours ($now IST) - not starting"; else echo "go=true" >> "$GITHUB_OUTPUT"; fi

  run:
    needs: gate
    if: needs.gate.outputs.go == 'true' && (github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'workflow_run' && github.event.workflow_run.conclusion != 'cancelled'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Install Playwright's Chromium (for automated Upstox login)
        run: playwright install --with-deps chromium

      - name: Log in to Upstox (TOTP)
        env:
          UPSTOX_CLIENT_ID: ${{ secrets.UPSTOX_CLIENT_ID }}
          UPSTOX_CLIENT_SECRET: ${{ secrets.UPSTOX_CLIENT_SECRET }}
          UPSTOX_REDIRECT_URI: ${{ secrets.UPSTOX_REDIRECT_URI }}
          UPSTOX_MOBILE_NUMBER: ${{ secrets.UPSTOX_MOBILE_NUMBER }}
          UPSTOX_TOTP_SECRET: ${{ secrets.UPSTOX_TOTP_SECRET }}
          UPSTOX_PIN: ${{ secrets.UPSTOX_PIN }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/login_upstox.py

      - name: Upload login failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: upstox-login-failure
          path: |
            upstox_login_failure.png
            upstox_login_failure.html
          if-no-files-found: ignore

      - name: Build the price action list
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}   # the step that WRITES the files needs it: they are encrypted only when it is set here
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCREENER_EMAIL: ${{ secrets.SCREENER_EMAIL }}         # the market-cap filter of the universe (screener.in custom screen)
          SCREENER_PASSWORD: ${{ secrets.SCREENER_PASSWORD }}
        run: python scripts/build_dashboard_setups.py
