name: Dashboard history

# Nightly: rebuilds the Replay data (last ~20 sessions of 5-minute candles) for docs/index.html.
on:
  schedule:
    - cron: "30 11 * * 1-5"   # 17:00 IST, after the close
  workflow_dispatch:

concurrency:
  group: dashboard-history
  cancel-in-progress: false

permissions:
  contents: write   # to publish to the dashboard-history branch

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Install Playwright's Chromium (for automated Upstox login)
        run: playwright install --with-deps chromium

      - name: Log in to Upstox (TOTP)
        env:
          UPSTOX_CLIENT_ID: ${{ secrets.UPSTOX_CLIENT_ID }}
          UPSTOX_CLIENT_SECRET: ${{ secrets.UPSTOX_CLIENT_SECRET }}
          UPSTOX_REDIRECT_URI: ${{ secrets.UPSTOX_REDIRECT_URI }}
          UPSTOX_MOBILE_NUMBER: ${{ secrets.UPSTOX_MOBILE_NUMBER }}
          UPSTOX_TOTP_SECRET: ${{ secrets.UPSTOX_TOTP_SECRET }}
          UPSTOX_PIN: ${{ secrets.UPSTOX_PIN }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/login_upstox.py

      - name: Upload login failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: upstox-login-failure
          path: |
            upstox_login_failure.png
            upstox_login_failure.html
          if-no-files-found: ignore

      - name: Build Replay history
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_dashboard_history.py
